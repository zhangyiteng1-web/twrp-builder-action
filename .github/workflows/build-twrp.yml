name: 编译 TWRP

on:
  workflow_dispatch:
    inputs:
      device_tree_repo:
        description: '设备树仓库地址（HTTPS）'
        required: true
        type: string
      device_tree_branch:
        description: '设备树分支（如 android-12.1）'
        required: true
        type: string
        default: 'android-12.1'
      manufacturer:
        description: '设备制造商（小写）'
        required: true
        type: string
      codename:
        description: '设备代号（小写）'
        required: true
        type: string
      twrp_branch:
        description: 'TWRP 源码分支（下拉选择，来自官方仓库）'
        required: true
        type: choice
        options:
          - twrp-14.1
          - twrp-14
          - twrp-12.1
          - twrp-11
          - twrp-9.0
          - twrp-8.1
          - twrp-7.1
          - twrp-6.0
          - twrp-5.1
        default: 'twrp-12.1'
      is_ab_device:
        description: '是否为 A/B 分区设备（勾选则编译 boot.img，否则编译 recovery.img）'
        required: false
        type: boolean
        default: false
      extra_env:
        description: '额外编译环境变量（可选）'
        required: false
        type: string
        default: ''

env:
  OUTPUT_DIR: out
  ARTIFACT_NAME: twrp-placeholder
  TARGET_IMG: placeholder.img

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置编译环境
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison gperf build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib \
            libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip python3-venv
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: 配置 Git 身份信息
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: 初始化 TWRP 源码（自动选择 Manifest）
        run: |
          mkdir -p twrp
          cd twrp
          TWRP_BRANCH="${{ github.event.inputs.twrp_branch }}"
          # 9.0 及以下使用 omni，11 及以上使用 aosp（包括 twrp-11、twrp-12.1、twrp-14、twrp-14.1）
          if [[ "$TWRP_BRANCH" == "twrp-9.0" || "$TWRP_BRANCH" == "twrp-8."* || "$TWRP_BRANCH" == "twrp-7."* || "$TWRP_BRANCH" == "twrp-6.0" || "$TWRP_BRANCH" == "twrp-5.1" ]]; then
            MANIFEST_URL="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git"
          else
            MANIFEST_URL="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git"
          fi
          echo "使用 manifest: ${MANIFEST_URL}, 分支: ${TWRP_BRANCH}"
          repo init -u ${MANIFEST_URL} -b ${TWRP_BRANCH} --depth=1

      - name: 克隆设备树
        run: |
          cd twrp
          mkdir -p device/${{ github.event.inputs.manufacturer }}/${{ github.event.inputs.codename }}
          cd device/${{ github.event.inputs.manufacturer }}/${{ github.event.inputs.codename }}
          git clone --depth=1 -b ${{ github.event.inputs.device_tree_branch }} ${{ github.event.inputs.device_tree_repo }} .

      - name: 同步 TWRP 源码
        run: |
          cd twrp
          repo sync --current-branch --no-tags --no-clone-bundle --no-repo-verify --force-sync -j$(nproc)

      - name: 修复过时的 PRODUCT_STATIC_BOOT_CONTROL_HAL
        run: |
          DEVICE_PATH="twrp/device/${{ github.event.inputs.manufacturer }}/${{ github.event.inputs.codename }}"
          if [ -f "$DEVICE_PATH/device.mk" ]; then
            sed -i '/^PRODUCT_STATIC_BOOT_CONTROL_HAL/,/^$/s/^/#/' "$DEVICE_PATH/device.mk"
            sed -i 's/full_base_telephony.mk/aosp_base.mk/g' "$DEVICE_PATH/device.mk"
            echo "已自动修复 device.mk"
          else
            echo "未找到 device.mk，跳过修复"
          fi

      - name: 创建缺失的 vendor/omni 文件
        run: |
          cd twrp
          mkdir -p vendor/omni/config
          if [ ! -f vendor/omni/config/common.mk ]; then
            touch vendor/omni/config/common.mk
          fi

      - name: 设置环境变量和编译目标
        id: set_vars
        run: |
          if [ "${{ github.event.inputs.is_ab_device }}" == "true" ]; then
            echo "TARGET_MAKE_TARGET=bootimage" >> $GITHUB_ENV
            echo "TARGET_IMG=boot.img" >> $GITHUB_ENV
            echo "ARTIFACT_NAME=twrp-boot-${{ github.event.inputs.codename }}" >> $GITHUB_ENV
            echo "编译目标: bootimage，产物: boot.img"
          else
            echo "TARGET_MAKE_TARGET=recoveryimage" >> $GITHUB_ENV
            echo "TARGET_IMG=recovery.img" >> $GITHUB_ENV
            echo "ARTIFACT_NAME=twrp-recovery-${{ github.event.inputs.codename }}" >> $GITHUB_ENV
            echo "编译目标: recoveryimage，产物: recovery.img"
          fi
          echo "TARGET_PRODUCT=omni_${{ github.event.inputs.codename }}" >> $GITHUB_ENV
          echo "TARGET_BUILD_VARIANT=eng" >> $GITHUB_ENV
          echo "OUT_DIR=${{ env.OUTPUT_DIR }}" >> $GITHUB_ENV
          echo "${{ github.event.inputs.extra_env }}" >> $GITHUB_ENV

      - name: 编译 TWRP
        run: |
          cd twrp
          source build/envsetup.sh
          lunch omni_${{ github.event.inputs.codename }}-eng
          make -j$(nproc) $TARGET_MAKE_TARGET

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: twrp/${{ env.OUTPUT_DIR }}/target/product/${{ github.event.inputs.codename }}/${{ env.TARGET_IMG }}
