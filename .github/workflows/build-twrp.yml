name: Build TWRP

on:
  workflow_dispatch:
    inputs:
      device_tree_repo:
        description: '设备树仓库地址（HTTPS）'
        required: true
        type: string
        default: 'https://github.com/yourusername/android_device_xiaomi_beryllium.git'
      device_tree_branch:
        description: '设备树分支（如 android-12.1）'
        required: true
        type: string
        default: 'android-12.1'
      manufacturer:
        description: '设备制造商（小写）'
        required: true
        type: string
      codename:
        description: '设备代号（小写）'
        required: true
        type: string
      twrp_branch:
        description: |
          TWRP 源码分支（从以下分支中选择）：
          - twrp-12.1 (Android 10+ 推荐)
          - twrp-12.0
          - twrp-11.0
          - twrp-10.0
          - twrp-9.0  (旧设备，如 Android 5.1 ~ 9.0)
          系统将根据分支自动选择正确的 manifest 仓库和编译参数。
        required: true
        type: string
        default: 'twrp-12.1'
      extra_env:
        description: '额外编译环境变量（可选）'
        required: false
        type: string
        default: ''

env:
  OUTPUT_DIR: out

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison gperf build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib \
            libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip python3-venv
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Configure Git identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Initialize TWRP source
        run: |
          mkdir -p twrp
          cd twrp
          TWRP_BRANCH="${{ github.event.inputs.twrp_branch }}"
          if [[ "$TWRP_BRANCH" == "twrp-9.0" || "$TWRP_BRANCH" == "twrp-8.0" || "$TWRP_BRANCH" == "twrp-7.0" || "$TWRP_BRANCH" == "twrp-6.0" ]]; then
            MANIFEST_URL="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git"
          else
            MANIFEST_URL="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git"
          fi
          echo "使用 manifest: ${MANIFEST_URL}, 分支: ${TWRP_BRANCH}"
          repo init -u ${MANIFEST_URL} -b ${TWRP_BRANCH} --depth=1

      - name: Clone device tree
        run: |
          cd twrp
          mkdir -p device/${{ github.event.inputs.manufacturer }}/${{ github.event.inputs.codename }}
          cd device/${{ github.event.inputs.manufacturer }}/${{ github.event.inputs.codename }}
          git clone --depth=1 -b ${{ github.event.inputs.device_tree_branch }} ${{ github.event.inputs.device_tree_repo }} .

      - name: Sync TWRP source
        run: |
          cd twrp
          repo sync --current-branch --no-tags --no-clone-bundle --no-repo-verify --force-sync -j$(nproc)

      - name: Create missing vendor/omni files
        run: |
          cd twrp
          mkdir -p vendor/omni/config
          if [ ! -f vendor/omni/config/common.mk ]; then
            touch vendor/omni/config/common.mk
          fi

      - name: Set up environment variables
        run: |
          TWRP_BRANCH="${{ github.event.inputs.twrp_branch }}"
          if [[ "$TWRP_BRANCH" == "twrp-9.0" || "$TWRP_BRANCH" == "twrp-8.0" || "$TWRP_BRANCH" == "twrp-7.0" || "$TWRP_BRANCH" == "twrp-6.0" ]]; then
            TARGET_BUILD_VARIANT="userdebug"
            echo "TARGET_PLATFORM_VERSION=PPR1" >> $GITHUB_ENV
          else
            TARGET_BUILD_VARIANT="eng"
          fi
          echo "TARGET_PRODUCT=omni_${{ github.event.inputs.codename }}" >> $GITHUB_ENV
          echo "TARGET_BUILD_VARIANT=${TARGET_BUILD_VARIANT}" >> $GITHUB_ENV
          echo "OUT_DIR=${{ env.OUTPUT_DIR }}" >> $GITHUB_ENV
          echo "${{ github.event.inputs.extra_env }}" >> $GITHUB_ENV

      - name: Build TWRP
        run: |
          cd twrp
          source build/envsetup.sh
          lunch omni_${{ github.event.inputs.codename }}-${TARGET_BUILD_VARIANT}
          make -j$(nproc) recoveryimage

      - name: Upload recovery image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: twrp-${{ github.event.inputs.codename }}
          path: twrp/${{ env.OUTPUT_DIR }}/target/product/${{ github.event.inputs.codename }}/recovery.img
