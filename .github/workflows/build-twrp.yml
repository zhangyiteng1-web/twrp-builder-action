name: 编译 TWRP

on:
  workflow_dispatch:
    inputs:
      device_tree_repo:
        description: '设备树仓库地址（HTTPS）'
        required: true
        type: string
      device_tree_branch:
        description: '设备树分支（如 android-12.1）'
        required: true
        type: string
        default: 'android-12.1'
      manufacturer:
        description: '设备制造商（小写）'
        required: true
        type: string
      codename:
        description: '设备代号（小写）'
        required: true
        type: string
      twrp_branch:
        description: 'TWRP 源码分支（推荐 twrp-12.1）'
        required: true
        type: string
        default: 'twrp-12.1'
      extra_env:
        description: '额外编译环境变量（可选）'
        required: false
        type: string
        default: ''

env:
  OUTPUT_DIR: out

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置编译环境
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison gperf build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib \
            libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip python3-venv
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: 配置 Git 身份信息
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: 初始化 TWRP 源码
        run: |
          mkdir -p twrp
          cd twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b ${{ github.event.inputs.twrp_branch }} --depth=1

      - name: 克隆设备树
        run: |
          cd twrp
          mkdir -p device/${{ github.event.inputs.manufacturer }}/${{ github.event.inputs.codename }}
          cd device/${{ github.event.inputs.manufacturer }}/${{ github.event.inputs.codename }}
          git clone --depth=1 -b ${{ github.event.inputs.device_tree_branch }} ${{ github.event.inputs.device_tree_repo }} .

      - name: 同步 TWRP 源码
        run: |
          cd twrp
          repo sync --current-branch --no-tags --no-clone-bundle --no-repo-verify --force-sync -j$(nproc)

      - name: 修复过时的 PRODUCT_STATIC_BOOT_CONTROL_HAL
        run: |
          DEVICE_PATH="twrp/device/${{ github.event.inputs.manufacturer }}/${{ github.event.inputs.codename }}"
          if [ -f "$DEVICE_PATH/device.mk" ]; then
            sed -i '/^PRODUCT_STATIC_BOOT_CONTROL_HAL/,/^$/s/^/#/' "$DEVICE_PATH/device.mk"
            sed -i 's/full_base_telephony.mk/aosp_base.mk/g' "$DEVICE_PATH/device.mk"
            echo "已自动修复 device.mk"
          else
            echo "未找到 device.mk，跳过修复"
          fi

      - name: 创建缺失的 vendor/omni 文件
        run: |
          cd twrp
          mkdir -p vendor/omni/config
          if [ ! -f vendor/omni/config/common.mk ]; then
            touch vendor/omni/config/common.mk
          fi

      - name: 设置环境变量
        run: |
          echo "TARGET_PRODUCT=omni_${{ github.event.inputs.codename }}" >> $GITHUB_ENV
          echo "TARGET_BUILD_VARIANT=eng" >> $GITHUB_ENV
          echo "OUT_DIR=${{ env.OUTPUT_DIR }}" >> $GITHUB_ENV
          echo "${{ github.event.inputs.extra_env }}" >> $GITHUB_ENV

      - name: 编译 TWRP
        run: |
          cd twrp
          source build/envsetup.sh
          lunch omni_${{ github.event.inputs.codename }}-eng
          make -j$(nproc) recoveryimage

      - name: 查找并上传 recovery 镜像
        run: |
          IMAGE_PATH=$(find twrp -name "recovery.img" -type f | head -n 1)
          if [ -z "$IMAGE_PATH" ]; then
            echo "错误：未找到 recovery.img"
            exit 1
          fi
          echo "找到 recovery.img 在: $IMAGE_PATH"
          mkdir -p artifact
          cp "$IMAGE_PATH" artifact/recovery.img
          echo "RECOVERY_IMAGE=artifact/recovery.img" >> $GITHUB_ENV

      - name: 上传 recovery 镜像作为工件
        uses: actions/upload-artifact@v4
        with:
          name: twrp-${{ github.event.inputs.codename }}
          path: artifact/recovery.img
