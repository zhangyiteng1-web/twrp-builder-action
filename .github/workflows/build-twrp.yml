name: 编译 TWRP

on:
  workflow_dispatch:
    inputs:
      device_tree_repo:
        description: '设备树仓库地址（HTTPS），必须遵循 android_device_{制造商}_{代号} 格式'
        required: true
        type: string
      device_tree_branch:
        description: '设备树分支（如 android-12.1）'
        required: true
        type: string
        default: 'android-12.1'
      android_version:
        description: '安卓版本（如 5.1, 6.0, 7.1, 8.1, 9, 10, 11, 12, 12.1, 13, 14）'
        required: true
        type: string
        default: '12.1'
      is_ab_device:
        description: '是否为 A/B 分区设备（勾选则编译 boot.img，否则编译 recovery.img）'
        required: false
        type: boolean
        default: false
      extra_env:
        description: '额外编译环境变量（可选）'
        required: false
        type: string
        default: ''

env:
  OUTPUT_DIR: out
  ARTIFACT_NAME: twrp-placeholder
  TARGET_IMG: placeholder.img

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置编译环境
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison gperf build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib \
            libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip python3-venv
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: 配置 Git 身份信息
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: 解析安卓版本并选择 TWRP 分支
        id: select_branch
        run: |
          VER="${{ github.event.inputs.android_version }}"
          VER=$(echo "$VER" | sed 's/Android //i' | sed 's/ android//i')
          case "$VER" in
            14|"14.0")
              API=34
              BRANCH="twrp-14"
              MANIFEST="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git"
              IS_OLD=false
              ;;
            13|"13.0")
              API=33
              BRANCH="twrp-14"
              MANIFEST="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git"
              IS_OLD=false
              ;;
            12.1|"12.1")
              API=32
              BRANCH="twrp-12.1"
              MANIFEST="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git"
              IS_OLD=false
              ;;
            12|"12.0")
              API=31
              BRANCH="twrp-12.1"
              MANIFEST="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git"
              IS_OLD=false
              ;;
            11|"11.0")
              API=30
              BRANCH="twrp-11"
              MANIFEST="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git"
              IS_OLD=false
              ;;
            10|"10.0")
              API=29
              BRANCH="twrp-11"
              MANIFEST="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git"
              IS_OLD=false
              ;;
            9|"9.0")
              API=28
              BRANCH="twrp-9.0"
              MANIFEST="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git"
              IS_OLD=true
              ;;
            8.1|"8.1.0"|"8.1")
              API=27
              BRANCH="twrp-8.1"
              MANIFEST="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git"
              IS_OLD=true
              ;;
            8.0|"8.0.0"|"8")
              API=26
              BRANCH="twrp-8.1"
              MANIFEST="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git"
              IS_OLD=true
              ;;
            7.1|"7.1.0"|"7.1.1"|"7.1.2")
              API=25
              BRANCH="twrp-7.1"
              MANIFEST="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git"
              IS_OLD=true
              ;;
            7.0|"7.0.0"|"7")
              API=24
              BRANCH="twrp-7.1"
              MANIFEST="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git"
              IS_OLD=true
              ;;
            6.0|"6.0.0"|"6")
              API=23
              BRANCH="twrp-6.0"
              MANIFEST="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git"
              IS_OLD=true
              ;;
            5.1|"5.1.0"|"5.1.1")
              API=22
              BRANCH="twrp-5.1"
              MANIFEST="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git"
              IS_OLD=true
              ;;
            5.0|"5.0.0"|"5")
              API=21
              BRANCH="twrp-5.1"
              MANIFEST="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git"
              IS_OLD=true
              ;;
            4.4|"4.4.0"|"4.4.1"|"4.4.2"|"4.4.3"|"4.4.4")
              API=19
              BRANCH="twrp-5.1"
              MANIFEST="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git"
              IS_OLD=true
              ;;
            *)
              echo "错误：不支持的安卓版本 '$VER'，请使用 4.4, 5.0, 5.1, 6.0, 7.0, 7.1, 8.0, 8.1, 9, 10, 11, 12, 12.1, 13, 14"
              exit 1
              ;;
          esac
          echo "解析版本 $VER -> API $API"
          echo "选择的 TWRP 分支: $BRANCH"
          echo "API_LEVEL=$API" >> $GITHUB_ENV
          echo "TWRP_BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "MANIFEST_URL=$MANIFEST" >> $GITHUB_ENV
          echo "IS_OLD=$IS_OLD" >> $GITHUB_ENV

      - name: 从设备树仓库 URL 解析制造商和代号
        id: parse_device
        run: |
          REPO_URL="${{ github.event.inputs.device_tree_repo }}"
          REPO_NAME=$(basename "$REPO_URL" .git)
          echo "仓库名: $REPO_NAME"
          IFS='_' read -ra PARTS <<< "$REPO_NAME"
          LEN=${#PARTS[@]}
          if [ $LEN -lt 2 ]; then
            echo "错误：仓库名 '$REPO_NAME' 不包含足够的下划线分隔段，无法提取制造商和代号。"
            echo "请确保仓库名遵循 'android_device_{制造商}_{代号}' 格式。"
            exit 1
          fi
          CODENAME="${PARTS[-1]}"
          MANUFACTURER="${PARTS[-2]}"
          if [ "$MANUFACTURER" == "device" ]; then
            if [ $LEN -ge 3 ]; then
              MANUFACTURER="${PARTS[-3]}"
            else
              echo "错误：无法从仓库名提取制造商，请确保格式为 android_device_{制造商}_{代号}。"
              exit 1
            fi
          fi
          if [ "$MANUFACTURER" == "android" ]; then
            if [ $LEN -ge 4 ]; then
              MANUFACTURER="${PARTS[-4]}"
            else
              echo "错误：无法从仓库名提取制造商，请确保格式为 android_device_{制造商}_{代号}。"
              exit 1
            fi
          fi
          echo "解析到制造商: $MANUFACTURER, 代号: $CODENAME"
          echo "MANUFACTURER=$MANUFACTURER" >> $GITHUB_ENV
          echo "CODENAME=$CODENAME" >> $GITHUB_ENV

      - name: 初始化 TWRP 源码
        run: |
          mkdir -p twrp
          cd twrp
          repo init -u ${MANIFEST_URL} -b ${TWRP_BRANCH} --depth=1

      - name: 克隆设备树
        run: |
          cd twrp
          mkdir -p device/${MANUFACTURER}/${CODENAME}
          cd device/${MANUFACTURER}/${CODENAME}
          git clone --depth=1 -b ${{ github.event.inputs.device_tree_branch }} ${{ github.event.inputs.device_tree_repo }} .

      - name: 检测设备树产品名（直接从 omni_*.mk 提取并清理）
        id: detect_product
        run: |
          DEVICE_PATH="twrp/device/${MANUFACTURER}/${CODENAME}"
          # 直接查找 omni_*.mk 文件
          OMNIFILE=$(ls $DEVICE_PATH/omni_*.mk 2>/dev/null | head -1)
          if [ -z "$OMNIFILE" ]; then
            echo "错误：未找到 omni_*.mk 文件，请检查设备树是否正确。"
            echo "设备树目录内容："
            ls -la $DEVICE_PATH/
            exit 1
          fi
          PRODUCT_NAME=$(basename "$OMNIFILE" .mk)
          echo "原始产品名: ${PRODUCT_NAME}"
          # 清理非法字符：替换空格和连字符为下划线，移除其他非字母数字下划线的字符
          PRODUCT_NAME_CLEAN=$(echo "$PRODUCT_NAME" | sed 's/[ -]/_/g' | sed 's/[^a-zA-Z0-9_]//g')
          echo "清理后产品名: ${PRODUCT_NAME_CLEAN}"
          echo "PRODUCT_NAME=${PRODUCT_NAME_CLEAN}" >> $GITHUB_ENV

      - name: 同步 TWRP 源码
        run: |
          cd twrp
          repo sync --current-branch --no-tags --no-clone-bundle --no-repo-verify --force-sync -j$(nproc)

      - name: 修复过时的 PRODUCT_STATIC_BOOT_CONTROL_HAL（仅针对新版本）
        if: ${{ env.IS_OLD == 'false' }}
        run: |
          DEVICE_PATH="twrp/device/${MANUFACTURER}/${CODENAME}"
          if [ -f "$DEVICE_PATH/device.mk" ]; then
            sed -i '/^PRODUCT_STATIC_BOOT_CONTROL_HAL/,/^$/s/^/#/' "$DEVICE_PATH/device.mk"
            sed -i 's/full_base_telephony.mk/aosp_base.mk/g' "$DEVICE_PATH/device.mk"
            echo "已自动修复 device.mk (新版本)"
          else
            echo "未找到 device.mk，跳过修复"
          fi

      - name: 创建缺失的 vendor/omni 文件
        run: |
          cd twrp
          mkdir -p vendor/omni/config
          if [ ! -f vendor/omni/config/common.mk ]; then
            touch vendor/omni/config/common.mk
          fi

      - name: 设置环境变量和编译目标
        id: set_vars
        run: |
          if [ "${{ github.event.inputs.is_ab_device }}" == "true" ]; then
            echo "TARGET_MAKE_TARGET=bootimage" >> $GITHUB_ENV
            echo "TARGET_IMG=boot.img" >> $GITHUB_ENV
            echo "ARTIFACT_NAME=twrp-boot-${CODENAME}" >> $GITHUB_ENV
            echo "编译目标: bootimage，产物: boot.img"
          else
            echo "TARGET_MAKE_TARGET=recoveryimage" >> $GITHUB_ENV
            echo "TARGET_IMG=recovery.img" >> $GITHUB_ENV
            echo "ARTIFACT_NAME=twrp-recovery-${CODENAME}" >> $GITHUB_ENV
            echo "编译目标: recoveryimage，产物: recovery.img"
          fi
          echo "TARGET_BUILD_VARIANT=eng" >> $GITHUB_ENV
          echo "OUT_DIR=${{ env.OUTPUT_DIR }}" >> $GITHUB_ENV
          echo "${{ github.event.inputs.extra_env }}" >> $GITHUB_ENV

      - name: 编译 TWRP
        run: |
          cd twrp
          source build/envsetup.sh
          lunch ${PRODUCT_NAME}-${TARGET_BUILD_VARIANT}
          if [ "$IS_OLD" == "true" ]; then
            echo "应用旧版本修复：TARGET_PLATFORM_VERSION=PPR1"
            make -j$(nproc) $TARGET_MAKE_TARGET TARGET_PLATFORM_VERSION=PPR1
          else
            make -j$(nproc) $TARGET_MAKE_TARGET
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: twrp/${{ env.OUTPUT_DIR }}/target/product/${PRODUCT_NAME}/${{ env.TARGET_IMG }}
